# Конфигурация сборки для Railway (Nixpacks).
#
# PHP-провайдер Nixpacks сам поднимает nginx + php-fpm и задаёт стартовую команду.
# Здесь — только сборка: установка зависимостей и кэширование.
#
# Миграции и сид админа вынесены в preDeployCommand (railway.json),
# т.к. в build-фазе БД недоступна — приватная сеть Railway работает
# только в рантайме.
#
# ВАЖНО: в переменных окружения сервиса на Railway задать
#   NIXPACKS_PHP_ROOT_DIR = /app/public
# чтобы веб-корнем стал public/ (точка входа Laravel).

[phases.build]
cmds = [
  "composer install --no-dev --optimize-autoloader --no-interaction",
  "php artisan config:cache",
  "php artisan route:cache",
  "php artisan view:cache",
]
